services:

  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d postgres"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  user-service:
    build:
      context: ./services/user-service

    environment:
      USER_ENVIRONMENT: ${ENVIRONMENT}
      USER_LOG_LEVEL: ${LOG_LEVEL}
      USER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${USER_DB}

    ports:
      - "8001:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped

  order-service:
      build:
        context: ./services/order-service

      environment:
        ORDER_ENVIRONMENT: ${ENVIRONMENT}
        ORDER_LOG_LEVEL: ${LOG_LEVEL}

        ORDER_DATABASE_URL: >-
          postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${ORDER_DB}

        ORDER_USER_SERVICE_URL: http://user-service:8000

        ORDER_USER_SERVICE_TIMEOUT_SECONDS: ${ORDER_USER_SERVICE_TIMEOUT_SECONDS:-2.0}

      ports:
        - "8002:8000"

      depends_on:
        postgres:
          condition: service_healthy

        user-service:
          condition: service_healthy

      healthcheck:
        test:
          [
            "CMD",
            "python",
            "-c",
            "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"
          ]
        interval: 5s
        timeout: 3s
        retries: 10
        start_period: 5s

      restart: unless-stopped

  payment-service:
    build:
      context: ./services/payment-service

    environment:
      PAYMENT_ENVIRONMENT: ${ENVIRONMENT}
      PAYMENT_LOG_LEVEL: ${LOG_LEVEL}

      PAYMENT_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${PAYMENT_DB}

      PAYMENT_ORDER_SERVICE_URL: http://order-service:8000

      PAYMENT_ORDER_SERVICE_TIMEOUT_SECONDS: ${PAYMENT_ORDER_SERVICE_TIMEOUT_SECONDS:-2.0}

    ports:
      - "8003:8000"

    depends_on:
      postgres:
        condition: service_healthy

      order-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped




volumes:
  postgres_data: